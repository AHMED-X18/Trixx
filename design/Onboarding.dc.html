<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF7A00; } a:hover { color: #E85D00; }
    .frame {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      border-radius: 32px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFBF7; color: #171717;
    }
    input, textarea { font-family: inherit; }
    input::placeholder, textarea::placeholder { color: #A8A8A8; }
  </style>
</helmet>

<div class="frame">
  <div style="padding: 28px 24px 0;">
    <div style="width:40px; height:40px; border-radius:12px; background:#FFF1E6; display:flex; align-items:center; justify-content:center; color:#FF7A00;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>

    <div style="margin-top:24px; display:flex; align-items:center; gap:12px;">
      <svg viewBox="0 0 160 160" width="44" height="44" style="flex-shrink:0; display:block;">
        <defs>
          <linearGradient id="foxOrange" x1="20" y1="10" x2="140" y2="150" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFB066"/><stop offset="55%" stop-color="#FF7A00"/><stop offset="100%" stop-color="#E85D00"/>
          </linearGradient>
        </defs>
        <path d="M56 78 C40 45 46 10 78 14 C92 42 90 70 74 86 Z" fill="url(#foxOrange)"/>
        <path d="M60 72 C50 48 54 24 74 26 C84 46 82 66 72 78 Z" fill="#FFF3E4"/>
        <path d="M104 78 C120 45 114 10 82 14 C68 42 70 70 86 86 Z" fill="url(#foxOrange)"/>
        <path d="M100 72 C110 48 106 24 86 26 C76 46 78 66 88 78 Z" fill="#FFF3E4"/>
        <circle cx="80" cy="86" r="52" fill="url(#foxOrange)"/>
        <ellipse cx="80" cy="104" rx="31" ry="23" fill="#FFF6EC"/>
        <ellipse cx="48" cy="100" rx="6" ry="4" fill="#FFB066" opacity="0.45"/>
        <ellipse cx="112" cy="100" rx="6" ry="4" fill="#FFB066" opacity="0.45"/>
        <path d="M56 66 Q64 61 72 66" stroke="#171717" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M88 66 Q96 61 104 66" stroke="#171717" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="64" cy="80" rx="6.4" ry="8.2" fill="#171717"/>
        <ellipse cx="96" cy="80" rx="6.4" ry="8.2" fill="#171717"/>
        <circle cx="61.5" cy="76" r="2" fill="#FFFFFF"/>
        <circle cx="93.5" cy="76" r="2" fill="#FFFFFF"/>
        <path d="M80 96 Q84 100 80 103 Q76 100 80 96 Z" fill="#171717"/>
        <path d="M68 108 Q80 116 92 108" stroke="#171717" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <div style="font-size:22px; font-weight:800; letter-spacing:-0.3px;">Créer un compte</div>
        <div style="font-size:13px; color:#6B6B6B; margin-top:2px;">Faites connaissance avec TRiXX.</div>
      </div>
    </div>

    <div style="margin-top:18px; display:inline-flex; align-items:center; gap:8px; background:#FFF1E6; border-radius:999px; padding:8px 14px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#FF7A00"><path d="M12 2l1.8 5.6L19.4 9.4 13.8 11.2 12 17 10.2 11.2 4.6 9.4 10.2 7.6 12 2z"/></svg>
      <span style="font-size:12px; font-weight:600; color:#E85D00;">7 jours d'essai gratuit, sans carte bancaire</span>
    </div>
  </div>

  <div style="padding: 24px 24px 0; display:flex; flex-direction:column; gap:16px;">
    <div>
      <div style="font-size:12px; font-weight:600; margin-bottom:6px;">Prénom</div>
      <div style="display:flex; align-items:center; gap:10px; height:50px; border:1px solid #EAEAEA; border-radius:14px; padding:0 14px; background:#FFFFFF;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <input type="text" placeholder="Alex" style="border:none; outline:none; flex:1; font-size:14px; background:transparent; color:#171717;">
      </div>
    </div>
    <div>
      <div style="font-size:12px; font-weight:600; margin-bottom:6px;">E-mail</div>
      <div style="display:flex; align-items:center; gap:10px; height:50px; border:1px solid #EAEAEA; border-radius:14px; padding:0 14px; background:#FFFFFF;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
        <input type="text" placeholder="vous@exemple.com" style="border:none; outline:none; flex:1; font-size:14px; background:transparent; color:#171717;">
      </div>
    </div>
    <div>
      <div style="font-size:12px; font-weight:600; margin-bottom:6px;">Mot de passe</div>
      <div style="display:flex; align-items:center; gap:10px; height:50px; border:2px solid #FF7A00; border-radius:14px; padding:0 14px; background:#FFFFFF;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
        <input type="password" placeholder="8 caractères min." style="border:none; outline:none; flex:1; font-size:14px; background:transparent; color:#171717;">
      </div>
    </div>

    <div style="display:flex; align-items:flex-start; gap:10px; margin-top:2px;">
      <div style="width:18px; height:18px; border-radius:6px; border:2px solid #FF7A00; background:#FF7A00; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div style="font-size:12px; color:#6B6B6B; line-height:1.5;">J'accepte les <span style="color:#FF7A00; font-weight:600;">CGU</span> et la <span style="color:#FF7A00; font-weight:600;">politique de confidentialité</span>.</div>
    </div>

    <button style="margin-top:8px; height:52px; border:none; border-radius:16px; background:#FF7A00; color:#FFFFFF; font-family:inherit; font-size:15px; font-weight:600; box-shadow:0 10px 20px -8px rgba(255,122,0,0.45);">Créer mon compte</button>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:36px; text-align:center; font-size:13px; color:#6B6B6B;">
    Vous avez un compte ? <span style="color:#FF7A00; font-weight:600;">Se connecter</span>
  </div>
</div>
</x-dc>
</body>
</html>
