<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF7A00; } a:hover { color: #E85D00; }
    .frame {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      border-radius: 32px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFBF7; color: #171717;
    }
    .scroll { position:absolute; top:0; left:0; right:0; bottom:76px; overflow-y:auto; }
    .navitem { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:56px; }
    .day { display:flex; flex-direction:column; align-items:center; gap:6px; width:38px; }
  </style>
</helmet>

<div class="frame">
  <div class="scroll">
    <!-- top bar -->
    <div style="padding:24px 20px 0; display:flex; align-items:center; justify-content:space-between;">
      <div style="font-size:21px; font-weight:800;">Planning</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="display:flex; background:#FFFFFF; border:1px solid #EAEAEA; border-radius:11px; padding:3px;">
          <div style="font-size:12px; font-weight:700; color:#FFFFFF; background:#FF7A00; border-radius:8px; padding:6px 11px;">Semaine</div>
          <div style="font-size:12px; font-weight:600; color:#6B6B6B; padding:6px 11px;">Mois</div>
        </div>
        <div style="width:38px; height:38px; border-radius:11px; background:#FF7A00; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 16px -8px rgba(255,122,0,0.55);">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
    </div>

    <!-- week strip -->
    <div style="margin:20px 20px 0; background:#FFFFFF; border:1px solid #EAEAEA; border-radius:18px; padding:14px 8px; display:flex; justify-content:space-between;">
      <div class="day"><div style="font-size:11px; color:#6B6B6B; font-weight:600;">L</div><div style="font-size:13px; font-weight:600; color:#171717; width:30px; height:30px; display:flex; align-items:center; justify-content:center;">22</div></div>
      <div class="day"><div style="font-size:11px; color:#6B6B6B; font-weight:600;">M</div><div style="font-size:13px; font-weight:600; color:#171717; width:30px; height:30px; display:flex; align-items:center; justify-content:center;">23</div></div>
      <div class="day"><div style="font-size:11px; color:#6B6B6B; font-weight:600;">M</div><div style="font-size:13px; font-weight:600; color:#171717; width:30px; height:30px; display:flex; align-items:center; justify-content:center; position:relative;">24<div style="position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background:#FF7A00;"></div></div></div>
      <div class="day"><div style="font-size:11px; color:#6B6B6B; font-weight:600;">J</div><div style="font-size:13px; font-weight:600; color:#171717; width:30px; height:30px; display:flex; align-items:center; justify-content:center;">25</div></div>
      <div class="day"><div style="font-size:11px; color:#6B6B6B; font-weight:600;">V</div><div style="font-size:13px; font-weight:600; color:#171717; width:30px; height:30px; display:flex; align-items:center; justify-content:center; position:relative;">26<div style="position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background:#FF7A00;"></div></div></div>
      <div class="day"><div style="font-size:11px; color:#6B6B6B; font-weight:600;">S</div><div style="font-size:13px; font-weight:600; color:#171717; width:30px; height:30px; display:flex; align-items:center; justify-content:center;">27</div></div>
      <div class="day"><div style="font-size:11px; font-weight:700; color:#FF7A00;">D</div><div style="font-size:13px; font-weight:800; color:#FFFFFF; width:30px; height:30px; border-radius:50%; background:#FF7A00; display:flex; align-items:center; justify-content:center;">28</div></div>
    </div>

    <!-- day heading -->
    <div style="margin:22px 20px 0; display:flex; align-items:center; justify-content:space-between;">
      <div style="font-size:15px; font-weight:700;">Dimanche 28</div>
      <div style="font-size:12px; color:#6B6B6B;">4 événements</div>
    </div>

    <div style="margin:12px 20px 24px; display:flex; flex-direction:column; gap:10px;">
      <div style="background:#FFFFFF; border:1px solid #EAEAEA; border-radius:16px; padding:13px 14px; display:flex; align-items:center; gap:12px;">
        <div style="width:4px; align-self:stretch; border-radius:4px; background:#FF7A00;"></div>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:600;">Revue produit</div>
          <div style="font-size:12px; color:#6B6B6B; margin-top:2px;">09:30 – 10:30</div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:#6B6B6B; background:#F3F3F3; border-radius:999px; padding:5px 10px;">TRAVAIL</div>
      </div>

      <div style="background:#FFFFFF; border:1px solid #EAEAEA; border-radius:16px; padding:13px 14px; display:flex; align-items:center; gap:12px;">
        <div style="width:4px; align-self:stretch; border-radius:4px; background:#3B82F6;"></div>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:600;">Déjeuner avec Marc</div>
          <div style="font-size:12px; color:#6B6B6B; margin-top:2px;">12:00 – 13:30</div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:#3B82F6; background:#EAF2FE; border-radius:999px; padding:5px 10px;">GOOGLE</div>
      </div>

      <div style="background:#FFF1E6; border:1px dashed #FFB066; border-radius:16px; padding:13px 14px; display:flex; align-items:center; gap:12px;">
        <div style="width:4px; align-self:stretch; border-radius:4px; background:#FF7A00;"></div>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:600; color:#E85D00;">Créneau libre suggéré</div>
          <div style="font-size:12px; color:#E85D00; opacity:0.85; margin-top:2px;">14:00 – 15:30</div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:#E85D00; background:#FFFFFF; border-radius:999px; padding:5px 10px;">TRIXX</div>
      </div>

      <div style="background:#FFFFFF; border:1px solid #EAEAEA; border-radius:16px; padding:13px 14px; display:flex; align-items:center; gap:12px; opacity:0.55;">
        <div style="width:4px; align-self:stretch; border-radius:4px; background:#22A06B;"></div>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:600; text-decoration:line-through;">Running 5 km</div>
          <div style="font-size:12px; color:#6B6B6B; margin-top:2px;">18:00 – 18:45</div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:#22A06B; background:#E8F6EF; border-radius:999px; padding:5px 10px;">HABITUDE</div>
      </div>
    </div>
  </div>

  <!-- bottom nav -->
  <div style="position:absolute; left:0; right:0; bottom:0; height:76px; background:#FFFFFF; border-top:1px solid #EAEAEA; display:flex; align-items:center; justify-content:space-around; padding:8px 12px 14px;">
    <div class="navitem">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span style="font-size:10.5px; font-weight:600; color:#6B6B6B;">Aujourd'hui</span>
    </div>
    <div class="navitem">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      <span style="font-size:10.5px; font-weight:600; color:#6B6B6B;">Chat</span>
    </div>
    <div class="navitem">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FF7A00" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span style="font-size:10.5px; font-weight:700; color:#FF7A00;">Planning</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
