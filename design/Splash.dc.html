<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #FF7A00; } a:hover { color: #E85D00; }
    .frame {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      border-radius: 32px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(120% 90% at 50% 12%, #FFF1E6 0%, #FFFBF7 55%, #FFFBF7 100%);
      color: #171717;
    }
  </style>
</helmet>

<div class="frame">
  <!-- top-left brand wordmark, small -->
  <div style="position:absolute; top:36px; left:28px; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#E85D00;">TRIXX</div>

  <!-- centered mark -->
  <div style="position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:0 40px;">

    <!-- fox mascot, full body -->
    <div style="filter:drop-shadow(0 16px 24px rgba(255,122,0,0.3));">
      <svg viewBox="0 0 200 280" width="128" height="180" style="display:block;">
        <defs>
          <linearGradient id="foxOrangeBody" x1="20" y1="10" x2="170" y2="270" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFB066"/><stop offset="55%" stop-color="#FF7A00"/><stop offset="100%" stop-color="#E85D00"/>
          </linearGradient>
        </defs>
        <path d="M126 210 C182 208 198 150 172 108 C160 88 142 96 143 118 C144 142 156 162 140 188 C132 198 126 204 126 210 Z" fill="url(#foxOrangeBody)"/>
        <ellipse cx="168" cy="112" rx="16" ry="22" fill="#FFF6EC" transform="rotate(-18 168 112)"/>
        <ellipse cx="100" cy="218" rx="42" ry="46" fill="url(#foxOrangeBody)"/>
        <ellipse cx="100" cy="226" rx="25" ry="34" fill="#FFF6EC"/>
        <ellipse cx="84" cy="266" rx="13" ry="9" fill="#171717"/>
        <ellipse cx="116" cy="266" rx="13" ry="9" fill="#171717"/>
        <ellipse cx="62" cy="222" rx="11" ry="15" fill="url(#foxOrangeBody)"/>
        <ellipse cx="138" cy="222" rx="11" ry="15" fill="url(#foxOrangeBody)"/>
        <path d="M74 78 C55 40 62 4 96 8 C112 38 110 70 92 88 Z" fill="url(#foxOrangeBody)"/>
        <path d="M78 72 C66 46 71 20 93 22 C104 44 102 66 90 80 Z" fill="#FFF3E4"/>
        <path d="M126 78 C145 40 138 4 104 8 C88 38 90 70 108 88 Z" fill="url(#foxOrangeBody)"/>
        <path d="M122 72 C134 46 129 20 107 22 C96 44 98 66 110 80 Z" fill="#FFF3E4"/>
        <circle cx="100" cy="90" r="56" fill="url(#foxOrangeBody)"/>
        <ellipse cx="100" cy="108" rx="33" ry="25" fill="#FFF6EC"/>
        <ellipse cx="66" cy="104" rx="6.5" ry="4.3" fill="#FFB066" opacity="0.45"/>
        <ellipse cx="134" cy="104" rx="6.5" ry="4.3" fill="#FFB066" opacity="0.45"/>
        <path d="M74 70 Q83 65 92 70" stroke="#171717" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <path d="M108 70 Q117 65 126 70" stroke="#171717" stroke-width="2.8" fill="none" stroke-linecap="round"/>
        <ellipse cx="83" cy="84" rx="6.8" ry="8.8" fill="#171717"/>
        <ellipse cx="117" cy="84" rx="6.8" ry="8.8" fill="#171717"/>
        <circle cx="80.3" cy="80" r="2.2" fill="#FFFFFF"/>
        <circle cx="114.3" cy="80" r="2.2" fill="#FFFFFF"/>
        <path d="M100 100 Q104.5 104.5 100 108 Q95.5 104.5 100 100 Z" fill="#171717"/>
        <path d="M86 112 Q100 121 114 112" stroke="#171717" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div style="font-size:34px; font-weight:800; letter-spacing:-0.5px; color:#171717;">TRiXX</div>
      <div style="font-size:14px; font-weight:500; color:#6B6B6B; text-align:center; max-width:260px; line-height:1.5;">Tâches, agenda, rappels et conversations — réunis dans un seul assistant proactif.</div>
    </div>
  </div>

  <!-- bottom actions -->
  <div style="position:absolute; left:24px; right:24px; bottom:48px; display:flex; flex-direction:column; gap:12px;">
    <button style="height:52px; border:none; border-radius:16px; background:#FF7A00; color:#FFFFFF; font-family:inherit; font-size:15px; font-weight:600; box-shadow:0 10px 20px -8px rgba(255,122,0,0.5);">Créer un compte</button>
    <button style="height:52px; border:1px solid #EAEAEA; border-radius:16px; background:#FFFFFF; color:#171717; font-family:inherit; font-size:15px; font-weight:600;">J'ai déjà un compte</button>
    <div style="text-align:center; font-size:12px; color:#6B6B6B; line-height:1.5; padding:0 12px;">En continuant, vous acceptez nos CGU et notre politique de confidentialité.</div>
  </div>
</div>
</x-dc>
</body>
</html>
